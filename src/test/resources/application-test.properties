spring.application.name=employee-management-test

# Use H2 for tests so the Maven build doesn't require a running MySQL server.
spring.datasource.url=jdbc:h2:mem:employee_management_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false
